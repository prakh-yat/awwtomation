# Awwtomation on a single Linux box: Postgres + web + worker (+ optional Caddy for HTTPS).
#
#   cp .env.example .env   # fill in: DATABASE_URL/DIRECT_URL are overridden below to use the bundled Postgres
#   docker compose up -d --build
#   docker compose --profile proxy up -d      # adds automatic HTTPS via Caddy (set APP_DOMAIN in .env)
#   docker compose logs -f web worker
#
# NEXT_PUBLIC_* are build args (inlined at build time): change them in .env and
# rebuild with `docker compose build web`. Full guide: docs/DEPLOY.md (section B).
name: awwtomation

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    # Point Prisma at the bundled Postgres. Using an external database instead
    # (Supabase, RDS…)? Delete these two lines and the `postgres`/`migrate`
    # depends_on blocks, and set DATABASE_URL/DIRECT_URL in .env.
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-awwtomation}
    DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-awwtomation}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-awwtomation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only: reachable for pg_dump/psql on the box, not from the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-awwtomation}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: applies prisma/migrations, then exits. web/worker wait for it.
  migrate:
    build:
      context: .
      target: worker
    <<: *app-env
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    <<: *app-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional automatic HTTPS. Requires ports 80/443 open and APP_DOMAIN's DNS
  # pointing at this machine. Caddy obtains and renews the certificate itself.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${APP_DOMAIN:-localhost} --to web:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
