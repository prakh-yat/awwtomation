# Awwtomation on a single Linux box: Supabase Postgres + web + worker (+ optional Caddy for HTTPS).
#
#   cp .env.example .env   # set DATABASE_URL and DIRECT_URL to your Supabase Postgres URLs
#   docker compose up -d --build
#   docker compose --profile proxy up -d      # adds automatic HTTPS via Caddy (set APP_DOMAIN in .env)
#   docker compose logs -f web worker
#
# NEXT_PUBLIC_* are build args (inlined at build time): change them in .env and
# rebuild with `docker compose build web`. Full guide: docs/DEPLOY.md (section B).
name: awwtomation

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    # Database URLs come from .env and point to Supabase Postgres.

services:
  # One-shot: applies prisma/migrations, then exits. web/worker wait for it.
  migrate:
    build:
      context: .
      target: worker
    <<: *app-env
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    <<: *app-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional automatic HTTPS. Requires ports 80/443 open and APP_DOMAIN's DNS
  # pointing at this machine. Caddy obtains and renews the certificate itself.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${APP_DOMAIN:-localhost} --to web:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
