name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values: nothing in CI talks to these services. NEXT_PUBLIC_* only
  # need to exist so `next build` can inline them; the rest satisfy getEnv().
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-only.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: ci-only-client-secret
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/awwtomation
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/awwtomation
  APP_ENCRYPTION_KEY: Y2ktb25seS1kdW1teS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVz
  CRON_SECRET: ci-only-cron-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Standalone output exists
        run: test -f .next/standalone/server.js

  migrations:
    name: Migrations match schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awwtomation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts skips prisma generate; the CLI alone is enough here.
      - run: npm ci --ignore-scripts
      - name: Migrations apply cleanly on Postgres 16
        run: npx prisma migrate deploy
      - name: Fail on drift between prisma/migrations and schema.prisma
        # Exit code 2 when the migrations folder would not produce the schema:
        # i.e. someone edited schema.prisma without `prisma migrate dev`.
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL"
          --exit-code

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
